{{- if and (eq .Values.ingress.controller "istio") (.Capabilities.APIVersions.Has "networking.istio.io/v1beta1") }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Values.istio.gatewayName }}
spec:
  selector:
    istio: ingressgateway
  servers:
    {{- if and .Values.certManager.enabled (.Capabilities.APIVersions.Has "cert-manager.io/v1/Certificate") }}
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
      {{- range .Values.ingress.hosts }}
        - {{ . }}
      {{- end }}
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.istio.tls.secretName }}
    {{- end }}
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
      {{- range .Values.ingress.hosts }}
        - {{ . }}
      {{- end }}
{{- end }}
