{{- if and (eq .Values.ingress.controller "traefik") (.Capabilities.APIVersions.Has "traefik.io/v1alpha1") }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Values.deploymentName }}-body-limit
spec:
  buffering:
    maxRequestBodyBytes: {{ .Values.ingress.maxRequestBodyBytes }}
{{- end }}
